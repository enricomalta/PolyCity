<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo 100% preenchido sem cantos arredondados no SVG -->
  <rect width="512" height="512" fill="#1e1e2e"/>
  
  <!-- Prédio Esquerda -->
  <polygon points="120,380 180,380 180,240 120,270" fill="#45475a"/>
  <polygon points="180,380 220,380 220,220 180,240" fill="#585b70"/>
  <polygon points="120,270 180,240 220,220 160,250" fill="#7f849c"/>

  <!-- Prédio Central -->
  <polygon points="200,380 280,380 280,140 200,180" fill="#2563eb"/>
  <polygon points="280,380 340,380 340,110 280,140" fill="#3b82f6"/>
  <polygon points="200,180 280,140 340,110 260,150" fill="#60a5fa"/>

  <!-- Prédio Direita -->
  <polygon points="320,380 390,380 390,260 320,290" fill="#059669"/>
  <polygon points="390,380 430,380 430,240 390,260" fill="#10b981"/>
  <polygon points="320,290 390,260 430,240 360,270" fill="#34d399"/>

  <!-- Chão / Base -->
  <polygon points="80,380 430,380 450,410 100,410" fill="#313244"/>
</svg>
